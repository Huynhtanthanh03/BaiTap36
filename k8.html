<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>K8 - Tính BMI</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

    <h1>K8 - Tính Chỉ Số BMI</h1>

</header>

<div class="container">

    <div class="card">

        <label>Cân nặng (kg)</label>

        <input
            type="number"
            id="weight"
            placeholder="Ví dụ: 60">

        <label>Chiều cao (m)</label>

        <input
            type="number"
            step="0.01"
            id="height"
            placeholder="Ví dụ: 1.70">

        <button onclick="calculateBMI()">

            Tính BMI

        </button>

        <div
            class="result"
            id="bmiResult">

            Kết quả sẽ hiển thị ở đây

        </div>

    </div>

    <br>

    <a href="bt36.html">

        <button>

            ⬅ Quay về Trang Chủ

        </button>

    </a>

</div>

<script src="js/script.js"></script>

</body>

</html>
